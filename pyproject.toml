[build-system]
requires = ["meson-python>=0.18", "meson>=1.3", "ninja", "numpy"]
build-backend = "mesonpy"

[project]
name = "pydseamslib"
version = "2.14.0"
description = "Python bindings for the d-SEAMS C++ engine (import dseams, import pydseams)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
keywords = [
  "molecular dynamics", "trajectory analysis", "ice", "water", "clathrate hydrate",
  "nucleation", "topology", "primitive rings", "LAMMPS", "GROMACS", "PLUMED", "ASE",
  "MDAnalysis", "OVITO",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
authors = [
  {name = "Ruhila S", email = "ruhiresearcher209@gmail.com"},
  {name = "Amrita Goswami", email = "amrita16thaug646@gmail.com"},
  {name = "Rohit Goswami", email = "rgoswami@ieee.org"},
]

[project.urls]
Homepage = "https://dseams.info"
Repository = "https://github.com/d-SEAMS/PydSEAMSlib"
Documentation = "https://d-seams.github.io/PydSEAMSlib/"
Engine = "https://github.com/d-SEAMS/seams-core"
Changelog = "https://github.com/d-SEAMS/PydSEAMSlib/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis>=6.0"]
ase = ["ase>=3.23"]
mdanalysis = ["MDAnalysis>=2.7"]
solvis = ["ase>=3.23", "solvis-tools>=0.1"]
docs = [
  "sphinx>=8",
  "shibuya",
  "myst-parser",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinxcontrib-bibtex",
  "sphinx-contributors",
  "sphinxcontrib-mermaid>=1.0",
]

[tool.meson-python]
# Only takes effect with -Dpython.allow_limited_api=true, which the
# cp312 wheel build passes; that wheel is tagged cp312-abi3.
limited-api = true

[tool.meson-python.args]
# Eigen always comes from its wrap so the sdist carries it. The runtime
# tags install libseams and libseams_lang from the seams-core subproject
# next to the extensions, and leave its headers and static archives out.
setup = ["--force-fallback-for=eigen3"]
install = ["--tags=runtime,python-runtime"]
dist = ["--include-subprojects"]

[tool.cibuildwheel]
# CPython 3.11 uses its own ABI; the 3.12 build serves stable-ABI interpreters.
build = ["cp311-*", "cp312-*"]
skip = ["pp*", "*musllinux*", "*i686*", "cp3??t-*"]
build-frontend = "build"
build-verbosity = 1
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
test-requires = ["pytest", "ase"]
test-command = [
  "python {project}/scripts/check_installed_api.py",
  "python -m pytest -q -p no:cacheprovider --import-mode=importlib {project}/tests/dseams/test_dseams.py {project}/tests/dseams/installed_package.py",
]

[[tool.cibuildwheel.overrides]]
select = "cp312-*"
config-settings = { "setup-args" = "-Dpython.allow_limited_api=true" }
inherit.config-settings = "append"

[tool.cibuildwheel.linux]
# linkcell is a Rust crate; the manylinux image has no toolchain.
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
# libc++ in the engine needs floating-point std::to_chars (macOS 13.3);
# 14.0 matches the 2.11 wheels.
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }
