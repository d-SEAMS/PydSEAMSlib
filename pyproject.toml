[build-system]
requires = ["meson-python>=0.17", "numpy"]
build-backend = "mesonpy"

[project]
name = "pydseamslib"
version = "2.11.1"
description = "Python bindings for the d-SEAMS C++ engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
keywords = [
  "molecular dynamics", "trajectory analysis", "ice", "water", "clathrate hydrate",
  "nucleation", "topology", "primitive rings", "LAMMPS", "GROMACS", "PLUMED", "ASE",
  "MDAnalysis", "OVITO",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
authors = [
  {name = "Ruhila S", email = "ruhiresearcher209@gmail.com"},
  {name = "Amrita Goswami", email = "amrita16thaug646@gmail.com"},
  {name = "Rohit Goswami", email = "rgoswami@ieee.org"},
]

[project.urls]
Homepage = "https://dseams.info"
Repository = "https://github.com/d-SEAMS/PydSEAMSlib"
Documentation = "https://d-seams.github.io/PydSEAMSlib/"
Engine = "https://github.com/d-SEAMS/seams-core"

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis>=6.0"]
ase = ["ase>=3.23"]
mdanalysis = ["MDAnalysis>=2.7"]
solvis = ["ase>=3.23", "solvis-tools>=0.1"]
docs = [
  "sphinx>=8",
  "shibuya",
  "myst-parser",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinxcontrib-bibtex",
  "sphinx-contributors",
  "sphinxcontrib-mermaid>=1.0",
]

[tool.meson-python]
limited-api = true

[tool.meson-python.args]
setup = []
install = ["--skip-subprojects"]

[tool.cibuildwheel]
# CPython 3.11 uses its own ABI; the 3.12 build serves stable-ABI interpreters.
build = "cp311-* cp312-*"
skip = ["pp*", "*musllinux*", "*i686*", "cp3??t-*"]

[[tool.cibuildwheel.overrides]]
select = "cp312-*"
config-settings = { setup-args = ["-Dpython.allow_limited_api=true"] }
