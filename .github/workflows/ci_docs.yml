# Kanged from eOn : https://github.com/TheochemUI/eOn
name: Build documentation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build_docs:
    name: Build documentation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install the molecule renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config zlib1g-dev libsqlite3-dev \
            xvfb libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xkb1 libxkbcommon-x11-0 mesa-vulkan-drivers libgl1-mesa-dri \
            libegl1
          python -m pip install 'meson>=1.3' ninja 'numpy>=1.24' 'nanobind>=2.4' \
            ovito pillow
      - name: Render the science tutorial figures
        run: |
          Xvfb :99 -screen 0 1280x1024x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json
          export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json
          CC=gcc CXX=g++ meson setup bbdir --force-fallback-for=eigen3 \
            -Dwith_chemfiles=enabled -Dwith_readcon=enabled
          meson compile -C bbdir
          DOCS_CI=1 meson test -C bbdir docs_science_tutorials --print-errorlogs
      - name: Generate Docs
        run: |
          pip install numpy sphinx shibuya myst-parser sphinx-copybutton \
            sphinx-design sphinxcontrib-bibtex sphinx-contributors \
            sphinxcontrib-mermaid sphinx-sitemap
          sphinx-build -b html docs/source html
      - name: SEO metadata
        run: |
          python docs/check_seo.py --self-test
          python docs/check_seo.py html
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --accept 200,206,429
            --root-dir ${{ github.workspace }}/html
            README.md 'html/**/*.html'
          fail: true
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'html'
  deploy:
    needs: build_docs
    runs-on: ubuntu-latest
    if: (github.event.pull_request.merged == true || github.event_name == 'push') && github.repository == 'd-SEAMS/PydSEAMSlib' && github.ref == 'refs/heads/main'
    # One deployment at a time; a queued deployment waits for the running
    # one instead of cancelling it. Pull request builds are not in the group.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The site as readers get it: every published page is a lychee input,
  # so relative links resolve against the page they are on. The page list
  # comes from the artifact the deploy job published. github.com answers
  # the per-page source links with 503 to automated clients; the files
  # they name are the sources this build read.
  live-links:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: pages
      - name: Page list
        run: |
          tar -tf pages/artifact.tar | grep '\.html$' | grep -v '_static/' \
            | sed 's#^\./##; s#^#https://python.dseams.info/#' > pages.txt
          wc -l pages.txt
          test -s pages.txt
      - name: Check links on the published site
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --accept 200,206,429
            --exclude '^https://doi\.org/10\.1021/'
            --exclude '^https://github\.com/d-SEAMS/PydSEAMSlib/(blob|edit)/main/docs/'
            --files-from pages.txt
          fail: true
