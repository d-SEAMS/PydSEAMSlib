name: Nix flake

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci_nix.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'meson.build'
      - 'pyproject.toml'
      - 'subprojects/**'
      - 'scripts/dist_subprojects.py'
      - 'scripts/stage_nanobind.py'
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci_nix.yml'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'meson.build'
      - 'pyproject.toml'
      - 'subprojects/**'
      - 'scripts/dist_subprojects.py'
      - 'scripts/stage_nanobind.py'
      - 'src/**'
      - 'tests/**'
      - 'examples/**'

permissions:
  contents: read

concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate, build, and test flake checks
        run: nix flake check --print-build-logs
