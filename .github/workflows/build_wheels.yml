name: Build wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - '.github/workflows/build_wheels.yml'
      - 'pyproject.toml'
      - 'meson.build'
      - 'scripts/check_installed_api.py'
      - 'src/**'
      - 'subprojects/*.wrap'
  pull_request:
    paths:
      - '.github/workflows/build_wheels.yml'
      - 'pyproject.toml'
      - 'meson.build'
      - 'scripts/check_installed_api.py'
      - 'src/**'
      - 'subprojects/*.wrap'
  workflow_dispatch:

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Eigen and BLAS for meson setup
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libblas-dev liblapack-dev pkg-config

      - name: Build sdist
        run: pipx run build --sdist

      - name: Test installed sdist API
        run: |
          python -m pip install 'ase>=3.23'
          python -m pip install dist/*.tar.gz
          python scripts/check_installed_api.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  build-wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            cibw-arch: x86_64
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            cibw-arch: aarch64
          - name: macOS arm64
            os: macos-latest
            cibw-arch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Build wheels
        run: uvx --from cibuildwheel cibuildwheel --output-dir wheelhouse
        env:
          # One CPython 3.12 build per platform. meson limited_api: '3.12'
          # tags the wheel abi3 (3.12+ GIL). Free-threaded CPython has no
          # stable ABI; do not add cp31xt here.
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*musllinux* *i686* cp3??t-*"
          CIBW_ARCHS: ${{ matrix.cibw-arch }}
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT: >
            MACOSX_DEPLOYMENT_TARGET=14
          CIBW_ENVIRONMENT_LINUX: PATH="$HOME/.cargo/bin:$PATH"
          CIBW_BEFORE_ALL_LINUX: >
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh &&
            sh /tmp/rustup-init.sh -y --profile minimal &&
            curl -sL https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz | tar xz &&
            cd eigen-3.4.0 && mkdir build && cd build &&
            cmake .. -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=OFF -DEIGEN_BUILD_DOC=OFF &&
            make install && cd ../.. && rm -rf eigen-3.4.0 &&
            (yum install -y blas-devel lapack-devel 2>/dev/null ||
            (apt-get update && apt-get install -y libblas-dev liblapack-dev) || true)
          CIBW_BEFORE_ALL_MACOS: >
            brew install eigen
          CIBW_BEFORE_BUILD: >
            pip install meson-python meson ninja nanobind numpy
          CIBW_TEST_REQUIRES: numpy ase
          CIBW_TEST_COMMAND: >
            python {project}/scripts/check_installed_api.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.cibw-arch }}
          path: ./wheelhouse/*.whl

  # Upload to PyPI on tag push
  publish:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # release/v1
        with:
          packages-dir: dist/
