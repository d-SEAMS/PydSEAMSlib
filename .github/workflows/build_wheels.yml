name: Build wheels
# pydseamslib on PyPI: the sdist, then wheels built from that sdist.
# Publishing uses PyPI trusted publishing for a version tag or a manual
# metadata correction to that tag on d-SEAMS/PydSEAMSlib main.
#
# The engine links the linkcell, minimage and readcon Rust crates, so
# every build host needs cargo.
on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - meson.build
      - src/**
      - subprojects/*.wrap
      - subprojects/packagefiles/**
      - tests/**
      - scripts/check_installed_api.py
      - .github/workflows/build_wheels.yml
  workflow_dispatch:
    inputs:
      release_tag:
        description: Rebuild an existing release with a corrected PyPI summary
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: wheels-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: ${{ !inputs.release_tag && !startsWith(github.ref, 'refs/tags/') }}

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.release_tag && '0' || '1' }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the package summary and release tag
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          if not 1 <= len(project["description"]) <= 512:
              raise SystemExit("PyPI requires a package summary of at most 512 characters")
          tag = os.environ["RELEASE_TAG"]
          if tag and tag != f"v{project['version']}":
              raise SystemExit(f"{tag} does not match package version {project['version']}")
          PY
      - name: Verify the summary correction against the existing tag
        if: inputs.release_tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ref="refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "$ref" HEAD
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          ref = "refs/tags/" + os.environ["RELEASE_TAG"]
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "-z", ref, "HEAD"], text=True
          ).rstrip("\0").split("\0")
          if set(changed) != {"pyproject.toml", ".github/workflows/build_wheels.yml"}:
              raise SystemExit(f"Unexpected changes since {ref}: {', '.join(changed)}")
          released = tomllib.loads(subprocess.check_output(
              ["git", "show", f"{ref}:pyproject.toml"], text=True
          ))
          candidate = tomllib.loads(Path("pyproject.toml").read_text())
          old_summary = released["project"].pop("description")
          new_summary = candidate["project"].pop("description")
          if released != candidate or old_summary == new_summary:
              raise SystemExit("The package summary must be the only metadata change")
          PY
      - name: Build the sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist
      - name: Install the sdist without fetching any subproject
        run: |
          # patchelf is a meson-python backend dependency on Linux. --no-index
          # cannot fetch it later, so it has to be in buildreqs.
          # The vendored Chemfiles build uses CMake, zlib and SQLite.
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config zlib1g-dev libsqlite3-dev
          mapfile -t test_reqs < <(python -c 'import tomllib; print(*tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["test"], sep="\n")')
          python -m pip download -d buildreqs "meson-python>=0.18" "meson>=1.3" ninja numpy patchelf "${test_reqs[@]}"
          python -m venv "$RUNNER_TEMP/sdist-venv"
          # nodownload: a subproject missing from the sdist fails the build
          # instead of being fetched; --no-index keeps pip offline too.
          # enabled: a release install must link readcon and chemfiles.
          sdist=(dist/pydseamslib-*.tar.gz)
          "$RUNNER_TEMP/sdist-venv"/bin/python -m pip install --no-index --find-links buildreqs \
            --config-settings=setup-args=--wrap-mode=nodownload \
            --config-settings=setup-args=-Dwith_chemfiles=enabled \
            --config-settings=setup-args=-Dwith_readcon=enabled \
            "${sdist[0]}[test]"
      - name: Test the sdist install
        working-directory: ${{ runner.temp }}
        run: |
          python "$GITHUB_WORKSPACE/subprojects/seams-core/input/fetch.py" mW_cubic.lammpstrj
          "$RUNNER_TEMP/sdist-venv"/bin/python -c 'import dseams, pydseams; print(dseams.__version__, pydseams.__version__)'
          "$RUNNER_TEMP/sdist-venv"/bin/python -c 'import pydseams as ds; readers = ds.available_readers(); assert ds.has_chemfiles() is True and ds.has_readcon() is True, readers; print(readers)'
          "$RUNNER_TEMP/sdist-venv"/bin/python "$GITHUB_WORKSPACE/scripts/check_installed_api.py"
          "$RUNNER_TEMP/sdist-venv"/bin/python -m pytest -q -p no:cacheprovider \
            --rootdir "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/tests/python"
          "$RUNNER_TEMP/sdist-venv"/bin/python -m pytest -q -p no:cacheprovider --import-mode=importlib \
            --rootdir "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/tests/dseams/test_dseams.py" \
            "$GITHUB_WORKSPACE/tests/dseams/test_dseams_empty_frames.py" \
            "$GITHUB_WORKSPACE/tests/dseams/test_reference_signatures.py" \
            "$GITHUB_WORKSPACE/tests/dseams/installed_package.py" \
            "$GITHUB_WORKSPACE/tests/dseams/docs" \
            "$GITHUB_WORKSPACE/tests/dseams/test_doc_snippets.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    needs: sdist
    name: wheels ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux_2_28, from pyproject.toml
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: aarch64 }
          # macos-14 was retired; macos-15 is the arm64 image.
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x86_64 }
    steps:
      # The sdist carries scripts/ and tests/, which the cibuildwheel
      # test command reads from {project}.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: sdist
      - name: Locate the sdist
        id: sdist
        shell: bash
        run: echo "path=$(ls sdist/pydseamslib-*.tar.gz)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: runner.os == 'macOS'
      # This build of libomp supports macOS 11 and newer. Keep the wheel's
      # macOS 14 deployment target when delocate bundles the runtime.
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        if: runner.os == 'macOS'
        with:
          environment-name: wheel-openmp
          create-args: llvm-openmp=23.1.6
          cache-environment: true
      - name: Select the macOS OpenMP runtime
        if: runner.os == 'macOS'
        run: |
          prefix="$MAMBA_ROOT_PREFIX/envs/wheel-openmp"
          test -f "$prefix/include/omp.h" && test -f "$prefix/lib/libomp.dylib"
          echo "LIBOMP_PREFIX=$prefix" >> "$GITHUB_ENV"
          # The Linkcell source distribution links to the runtime's @rpath name.
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-Wl,-rpath,$prefix/lib" >> "$GITHUB_ENV"
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  clean-install:
    needs: wheels
    name: clean install Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    container: python:${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-ubuntu-latest-x86_64
          path: wheelhouse
          merge-multiple: true
      - name: Install and test the wheel
        shell: bash
        run: |
          case "${{ matrix.python-version }}" in
            3.11) wheel=$(compgen -G 'wheelhouse/*cp311-cp311-manylinux*.whl') ;;
            3.12|3.13) wheel=$(compgen -G 'wheelhouse/*cp312-abi3-manylinux*.whl') ;;
          esac
          test -n "$wheel"
          python -m pip install "$wheel"
          python -c "import dseams, pydseams, pydseamslib; from dseams import userframe; print(dseams.__version__)"
          python -c "import pydseams as ds; readers = ds.available_readers(); assert ds.has_chemfiles() is True and ds.has_readcon() is True, readers; print(readers)"
          python - <<'PY'
          import dseams
          a = 2.75 * 4 / 3**0.5
          sites = ((0, 0, 0), (0.5, 0.5, 0), (0.5, 0, 0.5), (0, 0.5, 0.5), (0.25, 0.25, 0.25), (0.75, 0.75, 0.25), (0.75, 0.25, 0.75), (0.25, 0.75, 0.75))
          xyz = [[x * a, y * a, z * a] for x, y, z in sites]
          assert dseams.chill_plus(xyz, [a, a, a])[1][0] == 8
          PY
          python -m pip install "${wheel}[ase]"
          python -c "import dseams, ase"

  publish:
    needs: [sdist, wheels, clean-install]
    if: >-
      github.repository == 'd-SEAMS/PydSEAMSlib' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag))
    runs-on: ubuntu-latest
    # The trusted publisher on
    # https://pypi.org/manage/project/pydseamslib/settings/publishing/
    # names d-SEAMS/PydSEAMSlib, workflow build_wheels.yml, environment pypi.
    # Job permissions replace the workflow set, so the artifact download
    # needs actions: read next to the OIDC token.
    environment:
      name: pypi
      url: https://pypi.org/p/pydseamslib
    permissions:
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check the distributions
        run: |
          python -m pip install twine
          compgen -G 'dist/*.tar.gz' >/dev/null
          compgen -G 'dist/*.whl' >/dev/null
          twine check dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
