# To use:
#
#   $ mamba env create -f environment.yml
#   $ mamba activate pyseamsdev
#
name: pyseamsdev
channels:
  - conda-forge
dependencies:
  # meson-python refuses the limited API on the 3.14 builds it takes for
  # free-threaded; the wheels are built on 3.12 hosts
  - python >=3.12,<3.14
  - compilers
  - rust
  - meson
  - ninja
  - cmake
  - pkg-config
  - eigen
  - libblas
  - liblapack
  # Meson prefers FlexiBLAS when pkg-config finds it. These are the
  # conda-forge ABI packages (that channel has no FlexiBLAS build).
  - nanobind
  - numpy
  - pip
  - pytest
  - pre-commit
  - clang-format
  - ruff
